overrides:
  # One KaTeX for the stylesheet the app imports and for every renderer that
  # emits KaTeX markup (rehype-katex, @streamdown/math, mermaid all still
  # declare ^0.16): 0.18 renamed internal classes, so mixed versions render
  # unstyled math, and <0.18.2 honours an inherited `trust` option.
  katex: ^0.19.0
  # ansi-to-react (latest 6.2.6) still declares ^3, which has quadratic scans
  # in match(); the factory/tlds() API it calls is unchanged in 5.x.
  ansi-to-react>linkify-it: ^5.0.2

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@tauri-apps/api@2.12.4'
  - '@tauri-apps/cli-darwin-arm64@2.12.3'
  - '@tauri-apps/cli-darwin-x64@2.12.3'
  - '@tauri-apps/cli-linux-arm-gnueabihf@2.12.3'
  - '@tauri-apps/cli-linux-arm64-gnu@2.12.3'
  - '@tauri-apps/cli-linux-arm64-musl@2.12.3'
  - '@tauri-apps/cli-linux-riscv64-gnu@2.12.3'
  - '@tauri-apps/cli-linux-x64-gnu@2.12.3'
  - '@tauri-apps/cli-linux-x64-musl@2.12.3'
  - '@tauri-apps/cli-win32-arm64-msvc@2.12.3'
  - '@tauri-apps/cli-win32-ia32-msvc@2.12.3'
  - '@tauri-apps/cli-win32-x64-msvc@2.12.3'
  - '@tauri-apps/cli@2.12.3'
  - '@tauri-apps/plugin-dialog@2.8.3'
  - '@tauri-apps/plugin-opener@2.7.2'
  - '@tauri-apps/plugin-updater@2.14.0'
