name: Fork Windows Release

# Fork-only workflow: builds the Windows NSIS installer and publishes it as a
# release in this fork.
#
# Triggered by a `v*.*.*` tag push, or by hand via workflow_dispatch. The tag
# must live on a commit that already carries this file, because GitHub reads
# the workflow from the pushed ref. `release.yml` no longer has a tag trigger
# in this fork, so a tag push runs this workflow only.
#
# Running this by hand is also fine: the tag input is used then, and the tag is
# created by this workflow through GITHUB_TOKEN.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; must equal v + tauri.conf.json version"
        required: true
        default: "v0.45.0"

env:
  RUST_BACKTRACE: short
  HUSKY: 0

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches app version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "v$APP_VERSION" != "$RELEASE_TAG" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match app version v$APP_VERSION"
            exit 1
          fi

      - name: Stage sidecars for Tauri bundle
        shell: bash
        run: pnpm tauri:prepare-sidecars --target x86_64-pc-windows-msvc

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # Sidecars were staged for the matrix target above; keep
          # beforeBuildCommand from rebuilding them for the host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: codeg ${{ inputs.tag || github.ref_name }}
          releaseBody: "Fork build. Windows x64 NSIS installer only."
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis --config ${{ github.workspace }}/src-tauri/tauri-fork-windows.conf.json
          includeUpdaterJson: false
          retryAttempts: 2
