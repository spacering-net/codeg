name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_url: ${{ steps.release.outputs.release_url }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve release channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag commit belongs to default branch
        shell: bash
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "${DEFAULT_BRANCH}"

          TAG_COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if git merge-base --is-ancestor "${TAG_COMMIT}" "origin/${DEFAULT_BRANCH}"; then
            echo "Tag ${GITHUB_REF_NAME} is based on ${DEFAULT_BRANCH}"
          else
            echo "Tag ${GITHUB_REF_NAME} is not based on ${DEFAULT_BRANCH}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify tag matches app version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v$APP_VERSION"
            exit 1
          fi

      - id: release
        name: Create or reuse draft release
        uses: actions/github-script@v7
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { owner, repo } = context.repo;
            const prerelease = process.env.PRERELEASE === "true";
            const releaseName = `codeg ${tag}`;
            const { data: tagRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tag}`,
            });

            let commitSha = tagRef.object.sha;
            if (tagRef.object.type === "tag") {
              const { data: annotatedTag } = await github.rest.git.getTag({
                owner,
                repo,
                tag_sha: commitSha,
              });
              if (annotatedTag.object.type !== "commit") {
                core.setFailed(
                  `Tag ${tag} points to ${annotatedTag.object.type}, not a commit.`,
                );
                return;
              }
              commitSha = annotatedTag.object.sha;
            }

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: commitSha,
            });

            const releaseBody =
              commit.commit.message?.trim() || "_No commit message._";
            let release;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });

              if (!existing.data.draft) {
                core.setFailed(
                  `Release for tag ${tag} already exists and is not a draft.`,
                );
                return;
              }

              release = existing.data;
              if (
                release.prerelease !== prerelease ||
                release.name !== releaseName ||
                (release.body ?? "").trim() !== releaseBody
              ) {
                const updated = await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  name: releaseName,
                  prerelease,
                  body: releaseBody,
                });
                release = updated.data;
              }
              core.info(`Reusing existing draft release #${release.id}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease,
              });

              release = created.data;
              core.info(`Created draft release #${release.id}`);
            }

            core.setOutput("release_id", String(release.id));
            core.setOutput("release_url", release.html_url);
            core.setOutput("release_body", releaseBody);

  build-tauri:
    needs: create-draft-release
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS x64"
            runner: "macos-latest"
            target: "x86_64-apple-darwin"
          - name: "macOS arm64"
            runner: "macos-latest"
            target: "aarch64-apple-darwin"
          - name: "Linux x64"
            runner: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - name: "Linux arm64"
            runner: "ubuntu-22.04"
            target: "aarch64-unknown-linux-gnu"
          - name: "Windows x64"
            runner: "windows-2022"
            target: "x86_64-pc-windows-msvc"
          - name: "Windows arm64"
            runner: "windows-latest"
            target: "aarch64-pc-windows-msvc"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.target }}

      - name: Install Linux x64 dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Linux arm64 cross dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libgraphite2-3 / libharfbuzz0b / libfreetype6 / libssl3 are
          # Multi-Arch: same — their :arm64 and :amd64 copies must be the
          # EXACT same version. The runner ships stale :amd64 copies, and a
          # jammy security bump (e.g. graphite2 1.3.14-1ubuntu0.1) made the
          # :arm64 webkit dev chain demand a newer version than the preinstalled
          # :amd64. apt then refuses the :arm64 copy ("not going to be
          # installed" / held broken packages). Upgrading the preinstalled
          # :amd64 copies first lets both arches land on the same version.
          # --only-upgrade never installs new packages, so any lib that is
          # absent is simply skipped.
          sudo apt-get install -y --only-upgrade \
            libgraphite2-3 \
            libharfbuzz0b \
            libfreetype6 \
            libssl3
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            libssl-dev:arm64 \
            patchelf

      - name: Configure Linux arm64 cross env
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-Clinker=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Verify Linux arm64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc -v
          rustup target list --installed
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER}"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR}"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Computer use on macOS: codeg and codeg-computer-helper each check the
      # other's code signature at run time, against a designated requirement
      # compiled into the binary (never read from the bundle, which the user
      # can write to), and codeg launches the helper under a launch
      # requirement naming this Team ID, so the kernel runs nothing else from
      # the helper's path. All of it names this release's Team ID, so it is
      # pinned here, before anything is compiled, for every later step: the
      # helper is built by prepare-sidecars (it checks codeg), codeg by
      # tauri-action (it checks and launches the helper). A helper built
      # without its requirement refuses to start once it is Developer-ID
      # signed, and codeg will not build with one pin and not the other.
      - name: Pin computer-use trust anchors (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_TEAM_ID}" ]; then
            echo "FATAL: APPLE_TEAM_ID is required to pin the computer-use trust anchors"
            exit 1
          fi
          anchor="anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\""
          echo "CODEG_COMPUTER_PEER_REQUIREMENT=identifier \"app.codeg\" and ${anchor}" >> "$GITHUB_ENV"
          echo "CODEG_COMPUTER_HELPER_REQUIREMENT=identifier \"app.codeg.computer-helper\" and ${anchor}" >> "$GITHUB_ENV"
          echo "CODEG_COMPUTER_TEAM_ID=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"

      # Build the sidecars — the `codeg-mcp` companion, the
      # `codeg-computer-helper` computer-use executor and the `codeg-cli`
      # command-line client — for the matrix target
      # and stage them at `src-tauri/binaries/<bin>-<triple>{.exe}`.
      # `tauri-action` (below) then bundles them via the `bundle.externalBin`
      # entries in `tauri.conf.json` — Tauri installs them next to the main
      # executable (install root on Linux/Windows) where the runtime finds
      # them via `current_exe` sibling lookup. On macOS the helper is no
      # sidecar: it is staged as `src-tauri/binaries/codeg-computer-helper.app`
      # and bundled as `Contents/Helpers/codeg-computer-helper.app`
      # (`tauri.macos.conf.json`), since macOS charges an executable's
      # permissions to the app bundle it sits in — a helper in Contents/MacOS
      # would hold codeg's. The Linux arm64 cross env vars set above also
      # apply to this cargo invocation.
      - name: Stage sidecars for Tauri bundle
        shell: bash
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Verify sidecars landed
        shell: bash
        run: |
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          for bin in codeg-mcp codeg-computer-helper codeg-cli; do
            file="src-tauri/binaries/${bin}-${{ matrix.target }}${ext}"
            if [ ! -s "$file" ]; then
              echo "FATAL: sidecar $file missing or empty after prepare-sidecars"
              exit 1
            fi
            ls -la "$file"
          done
          case "${{ matrix.target }}" in
            *apple-darwin*)
              helper="src-tauri/binaries/codeg-computer-helper.app/Contents/MacOS/codeg-computer-helper"
              if [ ! -s "$helper" ]; then
                echo "FATAL: helper app executable $helper missing or empty after prepare-sidecars"
                exit 1
              fi
              ls -la "$helper"
              ;;
          esac

      - name: Import Apple Developer ID certificate
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required Apple signing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/codeg-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_search_list_path="$RUNNER_TEMP/codeg-keychains.txt"
          original_default_keychain="$(
            security default-keychain -d user \
              | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//'
          )"
          security list-keychains -d user \
            | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//' \
            > "$keychain_search_list_path"

          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_SEARCH_LIST_PATH=$keychain_search_list_path" >> "$GITHUB_ENV"
          echo "APPLE_ORIGINAL_DEFAULT_KEYCHAIN=$original_default_keychain" >> "$GITHUB_ENV"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            if [ -n "$existing_keychain" ]; then
              existing_keychains+=("$existing_keychain")
            fi
          done < "$keychain_search_list_path"
          if [ "${#existing_keychains[@]}" -eq 0 ]; then
            security list-keychains -d user -s "$keychain_path"
          else
            security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          fi
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 21600 -u "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Resolve Apple Developer ID identity
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          cert_info="$(
            security find-identity -v -p codesigning "$APPLE_KEYCHAIN_PATH" \
              | grep "Developer ID Application" \
              | head -n 1 \
              || true
          )"

          if [ -z "$cert_info" ]; then
            echo "::error::No Developer ID Application signing identity found in imported keychain."
            security find-identity -v -p codesigning "$APPLE_KEYCHAIN_PATH" || true
            exit 1
          fi

          cert_id="$(echo "$cert_info" | awk -F'"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"
          echo "Using Apple signing identity: $cert_id"

      # Tauri copies the helper app into the bundle (`bundle.macOS.files`)
      # without signing it, and signs the bundle around it without `--deep`,
      # so it is signed here, before the bundle is built — inside out, as
      # Apple requires — with the hardened runtime, a secure timestamp and no
      # entitlements, as notarization and the gate below need.
      - name: Sign the computer-use helper app (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          helper_app="src-tauri/binaries/codeg-computer-helper.app"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$helper_app"
          codesign --verify --strict -R="${CODEG_COMPUTER_HELPER_REQUIREMENT}" "$helper_app"
          codesign -dv "$helper_app" 2>&1 | grep -E '^(Identifier|TeamIdentifier)='

      - name: Build and upload to draft release (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR: aarch64-linux-gnu-gcc-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Clinker=aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc-ar
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # RPM takes no "-" in a version and the bundler stops at "invalid
          # version", so a release candidate (x.y.z-rc.N) ships no .rpm. The
          # tag is "v" + the version: create-draft-release makes sure of it.
          args: --target ${{ matrix.target }} --bundles ${{ contains(github.ref_name, '-') && 'deb' || 'deb,rpm' }}
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Build and upload to draft release (Windows)
        if: contains(matrix.target, 'windows')
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # Skip MSI bundling on Windows: tauri-apps/tauri#14681 — light.exe
          # fails when externalBin is configured. NSIS installer + updater
          # artifacts cover the same distribution channel.
          args: --target ${{ matrix.target }} --bundles nsis,updater
          includeUpdaterJson: true
          retryAttempts: 2

      - name: Build and upload to draft release (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # Every Linux bundle (deb, rpm, AppImage), less the .rpm for a
          # release candidate: see the arm64 step.
          args: --target ${{ matrix.target }}${{ contains(github.ref_name, '-') && ' --bundles deb,appimage' || '' }}
          includeUpdaterJson: true
          retryAttempts: 2

      - name: Build, sign, and upload to draft release (macOS)
        if: contains(matrix.target, 'apple-darwin')
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          # beforeBuildCommand runs `next build`, whose type-check needs more
          # than the 2 GB heap Node defaults to on these 7 GB runners; 4 GB is
          # what Node already gets on the 16 GB Linux and Windows runners.
          NODE_OPTIONS: --max-old-space-size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri notarizes the signed bundle when these three env vars are
          # present (in addition to the imported Developer ID cert +
          # APPLE_SIGNING_IDENTITY used for code signing).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          includeUpdaterJson: true
          retryAttempts: 2

      # The release gate for computer use on macOS. Notarization and a
      # `runtime` flag prove neither of the things that matter here, so each is
      # checked on the bundle that was just built and signed:
      #   * the helper is an app of its own, `Contents/Helpers/
      #     codeg-computer-helper.app`, and no bare copy of it is in
      #     `Contents/MacOS/`: macOS charges an executable's permissions to the
      #     app bundle it sits in, so a helper there would hold codeg's;
      #   * codeg, codeg-mcp, codeg-cli and codeg-computer-helper carry NO
      #     entitlements —
      #     in particular none that let another process load code into them
      #     (library-validation / dyld / get-task-allow exemptions), and codeg
      #     never Apple Events: every agent's shell runs as codeg for TCC.
      #   * each has the hardened runtime;
      #   * codeg satisfies the requirement compiled into the helper, and the
      #     helper the one compiled into codeg — otherwise the two refuse each
      #     other and computer use cannot start;
      #   * codeg, codeg-mcp and codeg-cli reference no Accessibility /
      #     event-posting /
      #     screen-capture API: holding or using those is the helper's job
      #     alone. `AXIsProcessTrusted` is the one allowed read-only query.
      #     codeg alone may also import `CGEventTapCreate`: global-hotkey,
      #     behind the stop shortcut, links it to watch media keys, and codeg
      #     never asks it to — `StopShortcut` names no media key and no webview
      #     is given the shortcut plugin, both held by tests. Nothing else is
      #     let through.
      #   * the bundle carries no `codeg-server`, and its `codeg-mcp` and
      #     `codeg-cli` are the sidecars built without the desktop features (no
      #     WebKit): the copies `tauri build` compiles itself stay out
      #     (`server-bin` / `mcp-bin` / `cli-bin`).
      - name: Verify computer-use signing and symbols (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/codeg.app"
          if [ ! -d "$app" ]; then
            echo "FATAL: $app not found"
            exit 1
          fi
          codesign --verify --strict --deep "$app"
          helper_app="$app/Contents/Helpers/codeg-computer-helper.app"
          if [ -e "$app/Contents/MacOS/codeg-computer-helper" ]; then
            echo "FATAL: codeg-computer-helper is in Contents/MacOS, where macOS charges it to codeg"
            exit 1
          fi
          if [ ! -d "$helper_app" ]; then
            echo "FATAL: $helper_app not found"
            exit 1
          fi
          if [ -e "$app/Contents/MacOS/codeg-server" ]; then
            echo "FATAL: codeg-server is in the desktop bundle; its binary target must need server-bin"
            exit 1
          fi
          for sidecar in codeg-mcp codeg-cli; do
            if otool -L "$app/Contents/MacOS/$sidecar" | grep -q 'WebKit'; then
              echo "FATAL: $sidecar links WebKit: tauri build's own copy replaced the sidecar"
              exit 1
            fi
          done
          for path in "$app/Contents/MacOS/codeg" "$app/Contents/MacOS/codeg-mcp" "$app/Contents/MacOS/codeg-cli" "$helper_app"; do
            name="$(basename "$path")"
            if ! codesign -dv "$path" 2>&1 | grep -q 'flags=0x[0-9a-f]*(runtime)'; then
              echo "FATAL: $name is not signed with the hardened runtime"
              exit 1
            fi
            if codesign -d --entitlements - --xml "$path" 2>/dev/null | grep -q '<key>'; then
              echo "FATAL: $name carries entitlements; codeg's executables must carry none"
              codesign -d --entitlements - "$path" || true
              exit 1
            fi
          done
          codesign --verify --strict -R="${CODEG_COMPUTER_PEER_REQUIREMENT}" "$app/Contents/MacOS/codeg"
          codesign --verify --strict -R="${CODEG_COMPUTER_HELPER_REQUIREMENT}" "$helper_app"
          deny='^_(CGEventPost|CGEventPostToPid|CGEventPostToPSN|CGEventTapCreate|CGEventTapCreateForPid|CGEventTapCreateForPSN|CGWindowListCreateImage|CGWindowListCreateImageFromArray|CGDisplayCreateImage|CGDisplayCreateImageForRect|CGDisplayStreamCreate|CGDisplayStreamCreateWithDispatchQueue|CGRequestScreenCaptureAccess|CGRequestPostEventAccess|AXIsProcessTrustedWithOptions|AXUIElement[A-Za-z]*|AXObserver[A-Za-z]*)$|^_OBJC_CLASS_\$_SC(ShareableContent|Stream|ScreenshotManager|ContentFilter|ContentSharingPicker)$'
          for bin in codeg codeg-mcp codeg-cli; do
            hits="$(nm -u "$app/Contents/MacOS/$bin" | grep -E "$deny" || true)"
            if [ "$bin" = codeg ]; then
              hits="$(printf '%s\n' "$hits" | grep -vx '_CGEventTapCreate' || true)"
            fi
            if [ -n "$hits" ]; then
              echo "FATAL: $bin references APIs only codeg-computer-helper may use:"
              echo "$hits"
              exit 1
            fi
          done
          echo "computer-use signing and symbol checks passed"

      - name: Delete Apple signing keychain
        if: always() && contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          if [ -n "${APPLE_ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$APPLE_ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi

          if [ -n "${APPLE_KEYCHAIN_SEARCH_LIST_PATH:-}" ] && \
             [ -f "$APPLE_KEYCHAIN_SEARCH_LIST_PATH" ]; then
            restored_keychains=()
            while IFS= read -r restored_keychain; do
              if [ -n "$restored_keychain" ]; then
                restored_keychains+=("$restored_keychain")
              fi
            done < "$APPLE_KEYCHAIN_SEARCH_LIST_PATH"

            if [ "${#restored_keychains[@]}" -ne 0 ]; then
              security list-keychains -d user -s "${restored_keychains[@]}" || true
            fi
          fi

          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi

          for path in \
            "${APPLE_CERTIFICATE_PATH:-}" \
            "${APPLE_KEYCHAIN_SEARCH_LIST_PATH:-}"; do
            if [ -n "$path" ]; then
              rm -f "$path"
            fi
          done

  build-server:
    needs: create-draft-release
    name: Server ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux x64"
            runner: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            artifact: "codeg-server-linux-x64"
          - name: "Linux arm64"
            runner: "ubuntu-22.04"
            target: "aarch64-unknown-linux-gnu"
            artifact: "codeg-server-linux-arm64"
          - name: "macOS x64"
            runner: "macos-latest"
            target: "x86_64-apple-darwin"
            artifact: "codeg-server-darwin-x64"
          - name: "macOS arm64"
            runner: "macos-latest"
            target: "aarch64-apple-darwin"
            artifact: "codeg-server-darwin-arm64"
          - name: "Windows x64"
            runner: "windows-2022"
            target: "x86_64-pc-windows-msvc"
            artifact: "codeg-server-windows-x64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: server-${{ matrix.target }}

      - name: Install Linux arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libssl3 is Multi-Arch: same; align the preinstalled :amd64 copy
          # with the version libssl-dev:arm64 pins so the cross install isn't
          # blocked by a held-back amd64 copy (same failure mode as the desktop
          # arm64 build — see the build-tauri step for the full rationale).
          sudo apt-get install -y --only-upgrade libssl3
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Build frontend
        env:
          # The `next build` type-check needs more than the 2 GB heap Node
          # defaults to on the 7 GB macOS runners. 4 GB is what Node already
          # gets on the 16 GB Linux and Windows runners, so it changes nothing
          # there.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build server + codeg-mcp companion + computer-use helper + codeg-cli
        working-directory: src-tauri
        # `codeg-mcp` is the stdio MCP companion the runtime injects per
        # session (see acp/delegation/companion.rs). Built with the same
        # `--no-default-features --target` flags as the server so it shares
        # the cross-compile env (Linux arm64) without dragging in tauri
        # runtime deps. Each binary target needs its own feature (Cargo.toml).
        # `codeg-computer-helper` serves computer use, which the server
        # offers only when started with CODEG_COMPUTER_USE=1 in a desktop
        # session; it ships beside the server, where the server looks for it.
        # `codeg-cli` is the command-line client (`codeg-cli run …`), for CI
        # jobs and scripts on the server's machine or reaching it with --url.
        run: |
          cargo build --release --bin codeg-server --no-default-features --features server-bin --target ${{ matrix.target }}
          cargo build --release --bin codeg-mcp --no-default-features --features mcp-bin --target ${{ matrix.target }}
          cargo build --release --bin codeg-computer-helper --no-default-features --features computer-helper --target ${{ matrix.target }}
          cargo build --release --bin codeg-cli --no-default-features --features cli-bin --target ${{ matrix.target }}

      # macOS holds what a person grants the server — Full Disk Access and the
      # other privacy permissions — to its designated requirement. Rust leaves
      # the arm64 binary linker-signed (ad-hoc), which makes that requirement
      # the one build's cdhash: every update, which puts another build at the
      # same path, took the grant back (#1035). The x86_64 binary is not
      # signed at all. Signed with the release's Developer ID under a fixed
      # identifier, both carry a requirement naming the identifier and the
      # Team ID, which every release keeps, as the desktop's executables do.
      # The certificate goes into a temporary keychain the way build-tauri
      # does it, after everything is built, and the keychain is deleted again
      # before anything else runs, so no build script or tool sees it
      # unlocked. No notarization credentials: these binaries are not
      # notarized.
      - name: Import Apple Developer ID certificate (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required Apple signing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/codeg-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_search_list_path="$RUNNER_TEMP/codeg-keychains.txt"
          original_default_keychain="$(
            security default-keychain -d user \
              | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//'
          )"
          security list-keychains -d user \
            | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//' \
            > "$keychain_search_list_path"

          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_SEARCH_LIST_PATH=$keychain_search_list_path" >> "$GITHUB_ENV"
          echo "APPLE_ORIGINAL_DEFAULT_KEYCHAIN=$original_default_keychain" >> "$GITHUB_ENV"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            if [ -n "$existing_keychain" ]; then
              existing_keychains+=("$existing_keychain")
            fi
          done < "$keychain_search_list_path"
          if [ "${#existing_keychains[@]}" -eq 0 ]; then
            security list-keychains -d user -s "$keychain_path"
          else
            security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          fi
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 21600 -u "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Resolve Apple Developer ID identity (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          cert_info="$(
            security find-identity -v -p codesigning "$APPLE_KEYCHAIN_PATH" \
              | grep "Developer ID Application" \
              | head -n 1 \
              || true
          )"

          if [ -z "$cert_info" ]; then
            echo "::error::No Developer ID Application signing identity found in imported keychain."
            security find-identity -v -p codesigning "$APPLE_KEYCHAIN_PATH" || true
            exit 1
          fi

          cert_id="$(echo "$cert_info" | awk -F'"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"
          echo "Using Apple signing identity: $cert_id"

      # Each executable is signed under its file name as its identifier (the
      # names the desktop bundle signs codeg-mcp and codeg-cli under), with
      # the hardened runtime, a secure timestamp and no entitlements. A grant
      # that outlives an update must not be borrowable by loading code into
      # the server — DYLD_* variables, a library it did not ship — and a
      # signature without a secure timestamp stops validating once the
      # certificate expires. Then each is checked against the requirement
      # macOS records for it. codeg-computer-helper stays ad-hoc: a helper
      # carrying a Team ID refuses to start unless codeg's designated
      # requirement was compiled into it (computer/helper/mod.rs), and this
      # build pins none. Last, the signed server is run once (`--version`) to
      # show it still launches under the hardened runtime.
      - name: Sign the server's executables with the Developer ID (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dir="src-tauri/target/${{ matrix.target }}/release"
          anchor="anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\""
          for bin in codeg-server codeg-mcp codeg-cli; do
            codesign --force --options runtime --timestamp \
              --identifier "$bin" \
              --sign "$APPLE_SIGNING_IDENTITY" "$dir/$bin"
            codesign --verify --strict -R="identifier \"$bin\" and ${anchor}" "$dir/$bin"
            info="$(codesign -dv --verbose=2 "$dir/$bin" 2>&1)"
            if ! grep -q 'flags=0x[0-9a-f]*(runtime)' <<< "$info"; then
              echo "FATAL: $bin is not signed with the hardened runtime"
              exit 1
            fi
            if ! grep -q '^Timestamp=' <<< "$info"; then
              echo "FATAL: $bin carries no secure timestamp"
              exit 1
            fi
            entitlements="$(codesign -d --entitlements - --xml "$dir/$bin" 2>/dev/null)"
            if grep -q '<key>' <<< "$entitlements"; then
              echo "FATAL: $bin carries entitlements; the server's executables must carry none"
              exit 1
            fi
            grep -E '^(Identifier|TeamIdentifier|Timestamp)=' <<< "$info"
          done
          "$dir/codeg-server" --version

      - name: Delete Apple signing keychain (macOS)
        if: always() && contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          if [ -n "${APPLE_ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$APPLE_ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi

          if [ -n "${APPLE_KEYCHAIN_SEARCH_LIST_PATH:-}" ] && \
             [ -f "$APPLE_KEYCHAIN_SEARCH_LIST_PATH" ]; then
            restored_keychains=()
            while IFS= read -r restored_keychain; do
              if [ -n "$restored_keychain" ]; then
                restored_keychains+=("$restored_keychain")
              fi
            done < "$APPLE_KEYCHAIN_SEARCH_LIST_PATH"

            if [ "${#restored_keychains[@]}" -ne 0 ]; then
              security list-keychains -d user -s "${restored_keychains[@]}" || true
            fi
          fi

          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi

          for path in \
            "${APPLE_CERTIFICATE_PATH:-}" \
            "${APPLE_KEYCHAIN_SEARCH_LIST_PATH:-}"; do
            if [ -n "$path" ]; then
              rm -f "$path"
            fi
          done

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp src-tauri/target/${{ matrix.target }}/release/codeg-server dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-mcp dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-computer-helper dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-cli dist/${{ matrix.artifact }}/
          chmod +x dist/${{ matrix.artifact }}/codeg-server dist/${{ matrix.artifact }}/codeg-mcp dist/${{ matrix.artifact }}/codeg-computer-helper dist/${{ matrix.artifact }}/codeg-cli
          cp -r out dist/${{ matrix.artifact }}/web
          cd dist && tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact }}
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-server.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-mcp.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-computer-helper.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-cli.exe dist/${{ matrix.artifact }}/
          Copy-Item -Recurse out dist/${{ matrix.artifact }}/web
          Compress-Archive -Path dist/${{ matrix.artifact }} -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Smoke test packaged artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          test -x "dist/${{ matrix.artifact }}/codeg-server"
          test -x "dist/${{ matrix.artifact }}/codeg-mcp"
          test -x "dist/${{ matrix.artifact }}/codeg-computer-helper"
          test -x "dist/${{ matrix.artifact }}/codeg-cli"
          # `codeg-mcp --help` exits 0 without flags and prints the usage
          # line. Only run it for native targets; cross-compiled arm64
          # binaries on x64 runners can't execute.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || \
             [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] || \
             [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "dist/${{ matrix.artifact }}/codeg-mcp" --help | grep -F 'codeg-mcp --parent-connection-id'
            "dist/${{ matrix.artifact }}/codeg-cli" --version | grep -F 'codeg-cli '
            "dist/${{ matrix.artifact }}/codeg-cli" --help | grep -F 'Usage: codeg-cli'
          else
            echo "skipping codeg-mcp --help and codeg-cli --version on cross-target ${{ matrix.target }}"
          fi

      - name: Smoke test packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-server.exe")) {
            throw "codeg-server.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-mcp.exe")) {
            throw "codeg-mcp.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-computer-helper.exe")) {
            throw "codeg-computer-helper.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-cli.exe")) {
            throw "codeg-cli.exe missing from packaged artifact"
          }
          $help = & "dist/${{ matrix.artifact }}/codeg-mcp.exe" --help
          if ($help -notlike "*codeg-mcp --parent-connection-id*") {
            throw "codeg-mcp --help output unexpected: $help"
          }
          # A console program: its help comes back on stdout, named as the
          # docs name it (no `.exe`).
          $cliHelp = (& "dist/${{ matrix.artifact }}/codeg-cli.exe" --help) -join "`n"
          if ($cliHelp -notlike "*Usage: codeg-cli*") {
            throw "codeg-cli --help output unexpected: $cliHelp"
          }

      - name: Upload artifact for Docker build (Linux only)
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

      # Sign the server bundle with the SAME minisign key the desktop
      # updater uses (`tauri signer sign` writes `<file>.sig`). The server's
      # `update::verify` module verifies this signature against the embedded
      # public key before installing — see src-tauri/src/update/verify.rs.
      # `--app-version` binds it to this release's version (the tag, which
      # the draft-release job matched against tauri.conf.json): the server
      # refuses an archive signed for any other version than latest.json
      # announces, or for none.
      - name: Sign and checksum bundle (Unix)
        if: runner.os != 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "dist/${{ matrix.artifact }}.tar.gz"
          test -f "dist/${{ matrix.artifact }}.tar.gz.sig"
          ( cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256" )

      - name: Sign and checksum bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          pnpm tauri signer sign --app-version $version "dist/${{ matrix.artifact }}.zip"
          if (-not (Test-Path "dist/${{ matrix.artifact }}.zip.sig")) {
            throw "signature not produced for ${{ matrix.artifact }}.zip"
          }
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.artifact }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "dist/${{ matrix.artifact }}.zip.sha256"

      - name: Upload to release (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "dist/${{ matrix.artifact }}.tar.gz" \
            "dist/${{ matrix.artifact }}.tar.gz.sig" \
            "dist/${{ matrix.artifact }}.tar.gz.sha256" \
            --clobber

      - name: Upload to release (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "dist/${{ matrix.artifact }}.zip" "dist/${{ matrix.artifact }}.zip.sig" "dist/${{ matrix.artifact }}.zip.sha256" --clobber

  build-docker:
    needs:
      - create-draft-release
      - build-server
    name: Build Docker image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: codeg-server-linux-x64
          path: artifacts/linux-x64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: codeg-server-linux-arm64
          path: artifacts/linux-arm64

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          cp artifacts/linux-x64/codeg-server dist/amd64/codeg-server
          cp artifacts/linux-x64/codeg-mcp dist/amd64/codeg-mcp
          cp artifacts/linux-x64/codeg-cli dist/amd64/codeg-cli
          cp artifacts/linux-arm64/codeg-server dist/arm64/codeg-server
          cp artifacts/linux-arm64/codeg-mcp dist/arm64/codeg-mcp
          cp artifacts/linux-arm64/codeg-cli dist/arm64/codeg-cli
          cp -r artifacts/linux-x64/web dist/web
          chmod +x dist/amd64/codeg-server dist/amd64/codeg-mcp dist/amd64/codeg-cli \
                   dist/arm64/codeg-server dist/arm64/codeg-mcp dist/arm64/codeg-cli
          # Fail fast if any companion went missing — Docker would otherwise
          # produce an image where delegation silently degrades, or without
          # the codeg-cli its docs promise.
          for f in dist/amd64/codeg-mcp dist/arm64/codeg-mcp dist/amd64/codeg-cli dist/arm64/codeg-cli; do
            test -x "$f" || { echo "FATAL: $f missing or non-exec"; exit 1; }
          done

      - name: Set up QEMU (for multi-arch manifest)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image runs its codeg-cli before it is pushed: an amd64 build loaded
      # into the runner's daemon, `codeg-cli --version` inside it.
      - name: Smoke test the image's codeg-cli (amd64)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -t codeg-smoke:local -f Dockerfile.ci .
          docker run --rm codeg-smoke:local codeg-cli --version | grep -F 'codeg-cli '
          docker run --rm codeg-smoke:local codeg-cli --help | grep -F 'Usage: codeg-cli'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # `latest` is the newest stable release. A release candidate goes out
      # under its own version only, so nothing that pulls `latest` is moved
      # onto it; the line that would name `latest` is left empty, and
      # build-push-action skips empty lines.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          # The source label is how ghcr.io ties the package to this
          # repository: the package page links back here and the package
          # inherits the repository's access permissions.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/codeg:${{ steps.version.outputs.version }}
            ${{ needs.create-draft-release.outputs.prerelease != 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
            ${{ needs.create-draft-release.outputs.prerelease != 'true' && format('{0}/codeg:latest', secrets.DOCKERHUB_USERNAME) || '' }}

  publish-release:
    needs:
      - create-draft-release
      - build-tauri
      - build-server
      - build-docker
    if: ${{ needs.build-tauri.result == 'success' && needs.build-server.result == 'success' && needs.build-docker.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const prerelease =
              "${{ needs.create-draft-release.outputs.prerelease }}" === "true";

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease,
            });

            core.info(`Published release #${releaseId}`);
