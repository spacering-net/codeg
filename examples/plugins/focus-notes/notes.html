<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Notes</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui; }
    body { margin: 0; padding: 12px; }
    main { display: grid; gap: 8px; }
    textarea { box-sizing: border-box; width: 100%; min-height: 7rem; font: inherit; }
    button { justify-self: start; font: inherit; }
    output { overflow-wrap: anywhere; }
  </style>
  <main>
    <label for="focus">What are you focusing on?</label>
    <textarea id="focus" maxlength="1000" disabled></textarea>
    <button type="button" disabled>Save note</button>
    <output role="status"></output>
  </main>
  <script type="module">
    const note = document.querySelector("textarea")
    const save = document.querySelector("button")
    const status = document.querySelector("output")

    try {
      await window.codeg.ready
      let snapshot = await window.codeg.settings.read()
      note.value = snapshot.value.note
      note.disabled = false
      save.disabled = false
      save.addEventListener("click", async () => {
        save.disabled = true
        try {
          snapshot = await window.codeg.settings.save(snapshot.revision, { note: note.value })
          status.textContent = "Saved."
        } catch (error) {
          status.textContent = String(error)
        } finally {
          save.disabled = false
        }
      })
    } catch (error) {
      status.textContent = String(error)
    }
  </script>
</html>
