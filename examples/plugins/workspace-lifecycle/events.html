<style>
  :root {
    color-scheme: light dark;
    font: 14px system-ui;
  }
  li {
    overflow-wrap: anywhere;
  }
</style>
<p id="status" role="status">Connecting…</p>
<ol id="events"></ol>
<script>
  window.codeg.ready.then(() => {
    document.getElementById("status").textContent =
      "Listening for workspace opens and closes."
    const events = document.getElementById("events")
    window.codeg.events.subscribe(({ event, data }) => {
      const row = document.createElement("li")
      row.textContent = `${event} · folder #${data.folderId}`
      events.prepend(row)
      if (events.children.length > 20) events.lastElementChild.remove()
    })
  })
</script>
